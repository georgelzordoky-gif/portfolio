name: Fetch Daily Coptic Readings

on:
  schedule:
    - cron: '5 22 * * *'
  workflow_dispatch:

jobs:
  update-readings:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch today readings and synaxarium
        run: |
          TODAY=$(TZ="Africa/Cairo" date +'%d-%m-%Y')
          curl -s "https://api.katameros.app/readings/gregorian/${TODAY}?languageId=3" -o daily_readings.json

      - name: Commit and push updated data
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add daily_readings.json
          git commit -m "Update daily readings for $(TZ='Africa/Cairo' date +'%Y-%m-%d')" || exit 0
          git push
